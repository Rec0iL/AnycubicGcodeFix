name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (converter + settings, no GUI dependency)
        run: python -m unittest discover -s tests -t . -v
      - name: Byte-compile
        run: python -m compileall -q gcodefix main.py

  ui-smoke:
    # Loads the real QML headlessly. Software-rendered CI runners are hit-and-miss for Qt Quick shaders,
    # so this reports problems without blocking merges; make it required once it has been stable for a while.
    name: UI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install PySide6
      - name: Load Main.qml offscreen
        run: python tests/smoke_qml.py

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh && bash -n install-macos.sh && bash -n uninstall-macos.sh
      - name: Linux installer, venv mode, throwaway HOME (no download)
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --venv --no-pip
          test -x "$HOME/.local/bin/anycubic-gcodefix"
          ./uninstall.sh --purge
          test ! -e "$HOME/.local/bin/anycubic-gcodefix"
      - name: Shader binary and icons present
        run: |
          test -s shaders/bg.frag.qsb
          test -s packaging/anycubic-gcodefix.ico
          test -s packaging/anycubic-gcodefix.icns
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in 'install-windows.ps1', 'uninstall-windows.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "$f parses OK"
          }

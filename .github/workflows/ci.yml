name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (converter has no GUI dependency)
        run: python -m unittest discover -s tests -t . -v
      - name: Byte-compile
        run: python -m compileall -q gcodefix main.py

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh
      - name: Shader binary present
        run: test -s shaders/bg.frag.qsb
